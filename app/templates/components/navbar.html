<header class="topbar">
  <div class="d-flex align-items-center gap-2">
    <button class="icon-btn d-lg-none" id="sidebarToggle" aria-label="Toggle navigation">
      <i class="fa-solid fa-bars"></i>
    </button>
    <button class="icon-btn d-none d-lg-inline-flex" id="sidebarCollapse" aria-label="Collapse sidebar">
      <i class="fa-solid fa-angles-left"></i>
    </button>

    <div class="search-shell d-none d-md-flex">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="search" class="form-control form-control-dark" placeholder="Search assets, CVEs, domains…" aria-label="Search">
      <kbd>/</kbd>
    </div>
  </div>

  <div class="d-flex align-items-center gap-2 ms-auto">
    <button class="icon-btn d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#mobileSearchArea" aria-expanded="false" aria-controls="mobileSearchArea" title="Search">
      <i class="fa-solid fa-magnifying-glass"></i>
    </button>

    <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
      <i class="fa-solid fa-moon"></i>
    </button>

    <div class="position-relative">
      <button class="icon-btn position-relative" data-bs-toggle="dropdown" aria-label="Notifications" title="Notifications">
        <i class="fa-solid fa-bell"></i>
        <span class="dot"></span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end p-2 shadow-sm" style="background:var(--card); border:1px solid var(--border-strong); width:320px; border-radius:14px;">
        <li class="px-2 py-1 mb-1 d-flex justify-content-between align-items-center">
          <span class="fw-bold small text-white">Notifications</span>
          <span class="badge-soft badge-critical">3 new</span>
        </li>
        <li><hr class="dropdown-divider" style="border-color:var(--border)"></li>
        <li><a class="dropdown-item small py-2" href="#" style="color:var(--text-primary); border-radius:8px;"><i class="fa-solid fa-circle-exclamation text-danger me-2"></i>Critical CVE detected on <b>api.acme.com</b></a></li>
        <li><a class="dropdown-item small py-2" href="#" style="color:var(--text-primary); border-radius:8px;"><i class="fa-solid fa-lock-open text-warning me-2"></i>New open port found — <b>203.0.113.4:8080</b></a></li>
        <li><a class="dropdown-item small py-2" href="#" style="color:var(--text-primary); border-radius:8px;"><i class="fa-solid fa-check text-success me-2"></i>Scan completed for <b>staging.acme.com</b></a></li>
        <li><hr class="dropdown-divider" style="border-color:var(--border)"></li>
        <li><a class="dropdown-item small text-center py-2" href="#" style="color:var(--green);">View all alerts</a></li>
      </ul>
    </div>

    <div class="dropdown">
      <button class="d-flex align-items-center gap-2 btn p-1 pe-2" data-bs-toggle="dropdown" style="border-radius:12px; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.03);">
        <img src="{{ current_user.avatar_url or 'https://i.pravatar.cc/64?img=13' }}" class="rounded-2" width="36" height="36" alt="User avatar">
        <span class="d-none d-md-block text-start">
          <span class="d-block small fw-bold text-white">{{ current_user.username }}</span>
          <span class="d-block" style="font-size:11px; color:var(--text-muted);">{{ current_user.role.name }}</span>
        </span>
        <i class="fa-solid fa-chevron-down d-none d-md-block" style="font-size:10px; color:var(--text-muted);"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end p-2 shadow-sm" style="background:var(--card); border:1px solid var(--border-strong); width:220px; border-radius:14px;">
        <li><a class="dropdown-item small py-2" href="{{ url_for('profile.view_profile') }}" style="color:var(--text-primary); border-radius:8px;"><i class="fa-solid fa-user me-2"></i>Profile</a></li>
        <li><a class="dropdown-item small py-2" href="{{ url_for('settings.settings') }}" style="color:var(--text-primary); border-radius:8px;"><i class="fa-solid fa-sliders me-2"></i>Settings</a></li>
        <li><hr class="dropdown-divider" style="border-color:var(--border)"></li>
        <li><a class="dropdown-item small py-2" href="{{ url_for('auth.logout') }}" style="color:var(--red); border-radius:8px;"><i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Logout</a></li>
      </ul>
    </div>
  </div>

  <div class="collapse mobile-search-area w-100" id="mobileSearchArea">
    <div class="search-shell w-100 py-2">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="search" class="form-control form-control-dark" placeholder="Search assets, CVEs, domains…" aria-label="Search">
      <kbd>/</kbd>
    </div>
  </div>
</header>
