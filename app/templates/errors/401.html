{% extends "base.html" %}
{% block title %}401 - Unauthorized{% endblock %}
{% block content %}
    <p class="error-code">401</p>
    <h1>Unauthorized</h1>
    <div class="subtitle">{{ message }}</div>
    <a class="btn" style="display:block; text-align:center; text-decoration:none;" href="{{ url_for('auth.login') }}">Go to Login</a>
{% endblock %}
